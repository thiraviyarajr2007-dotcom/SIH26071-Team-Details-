<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60" fill="none">
  <!-- SIH Badge Background -->
  <rect width="200" height="60" rx="8" fill="#FFFFFF" stroke="#000080" stroke-width="1.5"/>
  
  <!-- Tricolor Accent Bar -->
  <rect x="8" y="14" width="4" height="10" rx="2" fill="#FF9933"/>
  <rect x="8" y="25" width="4" height="10" rx="2" fill="#FFFFFF" stroke="#000080"/>
  <rect x="8" y="36" width="4" height="10" rx="2" fill="#138808"/>
  
  <!-- Emblem Icon: Ashoka Chakra stylized gear & digital node -->
  <g transform="translate(20, 10)">
    <circle cx="20" cy="20" r="18" fill="#FFFFFF" stroke="#000080" stroke-width="2"/>
    <circle cx="20" cy="20" r="13" stroke="#000080" stroke-width="1" stroke-dasharray="3 2"/>
    <circle cx="20" cy="20" r="5" fill="#000080"/>
    <!-- Cardinal node spikes -->
    <path d="M20 2 L20 7 M20 33 L20 38 M2 20 L7 20 M33 20 L38 20" stroke="#FF9933" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Typography -->
  <text x="68" y="25" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="14" fill="#000080" letter-spacing="1.5">SMART INDIA</text>
  <text x="68" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="12" fill="#138808" letter-spacing="2">HACKATHON</text>
  <text x="162" y="42" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="11" fill="#FF9933">2026</text>
</svg>
